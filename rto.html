<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backstage — Time Off</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){try{var t=localStorage.getItem('backstage_theme');if(t==='dark')document.documentElement.classList.add('dark')}catch(e){}})();
  </script>
</head>
<body>

<div class="app-shell"></div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
  const content = renderShell({ page: 'rto', title: 'Time Off' })
  const { pending, resolved } = RTO_DATA
  const approved = resolved.filter(r => r.status === 'approved')
  const denied = resolved.filter(r => r.status === 'denied')

  const TYPE_CHIP = { PTO: 'chip-blue', RTO: 'chip-slate', COMP: 'chip-violet', Sick: 'chip-amber' }
  const STATUS_CHIP = {
    pending:  { cls: 'chip-amber', label: 'Pending',  icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>` },
    approved: { cls: 'chip-green', label: 'Approved', icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>` },
    denied:   { cls: 'chip-red',   label: 'Denied',   icon: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>` },
  }

  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase()
  }

  function typeBadge(type) {
    return `<span class="chip ${TYPE_CHIP[type] || 'chip-slate'} chip-sm">${type}</span>`
  }

  function statusBadge(status) {
    const c = STATUS_CHIP[status] || STATUS_CHIP.pending
    return `<span class="chip ${c.cls} chip-sm">${c.icon}${c.label}</span>`
  }

  function pendingCard(req) {
    return `
      <div class="rto-card">
        <div class="rto-card-top">
          <div class="rto-card-who">
            <div class="avatar avatar-lg" style="background:${STORES[0].color}">${initials(req.name)}</div>
            <div>
              <div class="rto-name">${req.name}</div>
              <div class="rto-meta-row">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${req.dates}
              </div>
              <div class="rto-meta-row">Submitted ${req.submitted}</div>
            </div>
          </div>
          <div class="rto-badges">
            ${typeBadge(req.type)}
            ${statusBadge('pending')}
          </div>
        </div>
        ${req.note ? `<div class="rto-note">&ldquo;${req.note}&rdquo;</div>` : ''}
        <div class="rto-actions">
          <button class="btn btn-success btn-sm" onclick="showcaseToast('Approve triggers PATCH /api/rto/[id] + email notification')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Approve
          </button>
          <button class="btn btn-danger btn-sm" onclick="showcaseToast('Deny triggers PATCH /api/rto/[id] + leader note + email')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Deny
          </button>
          <button class="btn btn-ghost btn-sm" onclick="showcaseToast('Not included in this showcase')">Delete</button>
        </div>
      </div>
    `
  }

  function resolvedCard(req) {
    return `
      <div class="rto-card">
        <div class="rto-card-top">
          <div class="rto-card-who">
            <div class="avatar avatar-lg" style="background:${STORES[0].color}">${initials(req.name)}</div>
            <div>
              <div class="rto-name">${req.name}</div>
              <div class="rto-meta-row">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${req.dates}
              </div>
            </div>
          </div>
          <div class="rto-badges">
            ${typeBadge(req.type)}
            ${statusBadge(req.status)}
          </div>
        </div>
        ${req.leaderNote ? `
          <div class="rto-leader-note">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <span>Leader note: ${req.leaderNote}</span>
          </div>
        ` : ''}
        <div class="rto-actions">
          <button class="btn btn-ghost btn-sm" onclick="showcaseToast('Undo resets request to pending status')">Undo</button>
          <button class="btn btn-ghost btn-sm" onclick="showcaseToast('Not included in this showcase')">Delete</button>
        </div>
      </div>
    `
  }

  function emptyState(label) {
    return `
      <div class="empty-state">
        <div class="empty-state-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        No ${label} requests
      </div>
    `
  }

  const TABS = {
    pending:  { label: 'Pending',  data: pending,  render: pendingCard },
    approved: { label: 'Approved', data: approved, render: resolvedCard },
    denied:   { label: 'Denied',   data: denied,   render: resolvedCard },
  }

  function renderTab(active) {
    const tabsHTML = Object.entries(TABS).map(([key, t]) => `
      <button class="rto-tab ${key === active ? 'active' : ''}" onclick="renderTab('${key}')">
        ${t.label} <span class="rto-tab-count">${t.data.length}</span>
      </button>
    `).join('')

    const list = TABS[active].data
    const cardsHTML = list.length
      ? `<div class="rto-grid">${list.map(TABS[active].render).join('')}</div>`
      : emptyState(TABS[active].label.toLowerCase())

    document.getElementById('rto-tabs').innerHTML = tabsHTML
    document.getElementById('rto-list').innerHTML = cardsHTML
  }

  content.innerHTML = `
    <div class="showcase-banner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Showcase mode &mdash; approve/deny buttons are non-functional. Requests are fictional.
    </div>

    <div class="rto-sticky-header">
      <div class="page-header-row" style="margin-bottom:16px">
        <div>
          <div class="page-h1">Time Off Requests</div>
          <div class="page-sub">${STORES[0].name} &middot; ${STORES[0].city}</div>
        </div>
        <button class="btn btn-primary btn-md" onclick="showcaseToast('Not included in this showcase')">
          Open submission form
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
      </div>
      <div class="rto-tabs" id="rto-tabs"></div>
    </div>

    <div id="rto-list"></div>
  `

  renderTab('pending')
</script>

</body>
</html>
