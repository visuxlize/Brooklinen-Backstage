<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backstage — Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell"></div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
  const content = renderShell({
    page: 'schedule',
    title: 'Schedule',
    subtitle: `Week of ${SCHEDULE_DATA.weekOf} &nbsp;&middot;&nbsp; ${SCHEDULE_DATA.store}`,
  })

  const s = SCHEDULE_DATA

  /**
   * Shift cell renderer.
   * Returns styled HTML for a given shift string.
   * "OFF" gets muted treatment, regular shifts get the green badge,
   * "PTO" gets the gold treatment to match badge-pto class.
   */
  function shiftCell(value) {
    if (!value || value === 'OFF') {
      return `<span class="shift-off">OFF</span>`
    }
    if (value === 'PTO') {
      return `<span class="shift-cell" style="background:rgba(196,162,74,0.15);color:#9A7820">PTO</span>`
    }
    return `<span class="shift-cell shift-work">${value}</span>`
  }

  function powerCell(value) {
    return `<span class="shift-cell shift-power">${value}</span>`
  }

  // Employee initials for avatar
  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase()
  }

  // Hours summary per employee (rough: count shifts that aren't OFF)
  const days = s.days
  const dayHeaders = days.map(d => `<th>${d}</th>`).join('')

  const employeeRows = s.employees.map(emp => {
    const cells = emp.shifts.map(shift => `<td>${shiftCell(shift)}</td>`).join('')
    return `
      <tr>
        <td>
          <div class="flex items-center gap-8">
            <div style="
              width:28px;height:28px;border-radius:50%;
              background:var(--charcoal);color:white;
              display:flex;align-items:center;justify-content:center;
              font-size:9px;font-weight:700;flex-shrink:0;
            ">${initials(emp.name)}</div>
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--charcoal)">${emp.name}</div>
              <div class="emp-role-chip">${emp.role}</div>
            </div>
          </div>
        </td>
        <td style="font-weight:600;color:var(--charcoal);text-align:center">${emp.wtd}</td>
        ${cells}
      </tr>
    `
  }).join('')

  const powerRow = s.powerHour.map(p => `<td>${powerCell(p)}</td>`).join('')

  content.innerHTML = `
    <div class="showcase-banner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Showcase mode &mdash; schedule reflects fictional employees and mock shift data.
    </div>

    <!-- Week summary stats -->
    <div class="grid-4 mb-24">
      <div class="stat-card">
        <div class="stat-label">Budget Hours</div>
        <div class="stat-val">${s.budgetHours}</div>
        <div class="stat-sub">This week target</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Trending Hours</div>
        <div class="stat-val">${s.trendingHours}</div>
        <div class="stat-sub" style="color:var(--sage)">-7 vs budget</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Staff on Floor</div>
        <div class="stat-val">${s.employees.length}</div>
        <div class="stat-sub">Active this week</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Coverage Days</div>
        <div class="stat-val">7</div>
        <div class="stat-sub">Full week coverage</div>
      </div>
    </div>

    <!-- Week navigator -->
    <div class="flex items-center justify-between mb-16">
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--charcoal)">
          ${s.store} &nbsp;&middot;&nbsp; ${s.weekOf}
        </div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-ghost" style="padding:7px 14px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Prev Week
        </button>
        <button class="btn btn-ghost" style="padding:7px 14px">
          Next Week
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- Schedule grid -->
    <div class="card">
      <div class="schedule-wrap">
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="min-width:180px">Employee</th>
              <th style="min-width:60px">WTD</th>
              ${dayHeaders}
            </tr>
          </thead>
          <tbody>

            <!-- Meta: Budget row -->
            <tr class="sched-meta-row">
              <td>Budget Goal</td>
              <td></td>
              <td>$685</td><td>$623</td><td>$598</td><td>$712</td><td>$688</td><td>$760</td><td>$734</td>
            </tr>

            <!-- Meta: LY row -->
            <tr class="sched-meta-row">
              <td>LY Net</td>
              <td></td>
              <td>$702</td><td>$598</td><td>$611</td><td>$685</td><td>$674</td><td>$788</td><td>$751</td>
            </tr>

            <!-- Meta: Power Hour -->
            <tr class="sched-meta-row">
              <td style="color:var(--clay)">Power Hour</td>
              <td></td>
              ${powerRow}
            </tr>

            <!-- Employee rows -->
            ${employeeRows}

            <!-- Meta: Actual hours -->
            <tr class="sched-meta-row" style="border-top:2px solid var(--border)">
              <td style="color:var(--blue)">Actual Hours</td>
              <td style="font-weight:700;color:var(--charcoal)">141h</td>
              <td>28h</td><td>22h</td><td>22h</td><td>26h</td><td>22h</td><td>14h</td><td>7h</td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex gap-16 mb-24" style="margin-top:16px;flex-wrap:wrap">
      <div class="flex items-center gap-8">
        <span class="shift-cell shift-work" style="font-size:10px">10AM–6PM</span>
        <span class="text-xs text-mid">Work shift</span>
      </div>
      <div class="flex items-center gap-8">
        <span class="shift-off">OFF</span>
        <span class="text-xs text-mid">Day off</span>
      </div>
      <div class="flex items-center gap-8">
        <span class="shift-cell" style="background:rgba(196,162,74,0.15);color:#9A7820;font-size:10px;padding:3px 7px;border-radius:4px">PTO</span>
        <span class="text-xs text-mid">Paid time off</span>
      </div>
      <div class="flex items-center gap-8">
        <span class="shift-cell shift-power" style="font-size:9px;padding:3px 7px;border-radius:4px">1–3PM</span>
        <span class="text-xs text-mid">Power Hour window</span>
      </div>
    </div>
  `
</script>

</body>
</html>
